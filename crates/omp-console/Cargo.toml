[package]
name = "omp-console"
description = "A local web console for omp sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "omp-console"
path = "src/main.rs"

[lib]
name = "omp_console"
path = "src/lib.rs"

[dependencies]
omp-protocol = { path = "../omp-protocol" }
axum = { version = "0.8", features = ["ws", "json", "http1", "tokio"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
  "fs",
  "net",
  "signal",
] }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = "1"
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

