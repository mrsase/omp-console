name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: omp-console-darwin-arm64
          - name: darwin-x64
            os: macos-13
            target: x86_64-apple-darwin
            artifact: omp-console-darwin-x64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: omp-console-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build web bundle
        run: cd web && bun install --frozen-lockfile && bun run build

      - name: Build binary
        run: cargo build --release -p omp-console --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dir="${{ matrix.artifact }}-${version}"
          mkdir -p "dist/$dir"
          cp "target/${{ matrix.target }}/release/omp-console" "dist/$dir/"
          cp README.md LICENSE "dist/$dir/"
          tar -C dist -czf "dist/${{ matrix.artifact }}-${version}.tar.gz" "$dir"
          cd dist
          shasum -a 256 "${{ matrix.artifact }}-${version}.tar.gz" > "${{ matrix.artifact }}-${version}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}-*.tar.gz
            dist/${{ matrix.artifact }}-*.tar.gz.sha256

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
